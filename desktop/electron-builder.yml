# MingDao Harness 桌面版打包配置
# 产物：Windows NSIS 安装包 / macOS dmg / Linux AppImage+deb
# 本地验证：cd desktop && npm run dist:dir（生成未打包可运行目录）
appId: com.mingdao.harness
productName: MingDao Harness
copyright: © 2026 MingDaoTCM

directories:
  output: dist
  buildResources: build

# 应用内只带主进程壳；src/assets/skills 经 extraResources 随包分发（零 npm 运行时依赖不变）
# build/icon.png + tray.png 必须打包进 asar：窗口/托盘图标运行时按路径读取，
# 此前 files 白名单漏掉 build/ → 打包版窗口图标与托盘图标缺失（审计：图标统一修复）
files:
  - main.js
  - package.json
  - build/icon.png
  - build/tray.png
extraResources:
  - from: ../src
    to: src
  - from: ../assets
    to: assets
  - from: ../skills
    to: skills

asar: true
npmRebuild: false

# 自动更新发布渠道（审计 workbuddy P3-1）：目标用户在国内，GitHub Releases 直连不稳、
# 自动更新形同虚设——改用官网自托管 generic feed（https://harness.mingdao.ai/updates/latest*.yml，
# 每次发版随安装包一起上传）。electron-updater 按平台读取 latest.yml/latest-mac.yml/latest-linux.yml。
publish:
  provider: generic
  url: https://harness.mingdao.ai/updates/

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# —— 代码签名（可选，详见 ../docs/CODE-SIGNING.md） ——
# 传统证书（OV/EV）：无需改本文件——设置 CSC_LINK（pfx base64）+ CSC_KEY_PASSWORD 即可。
# Azure Trusted Signing（个人推荐，$9.99/月）：取消注释并填入你的账户信息，
# 同时配置 AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET 环境变量。
# win:
#   azureSignOptions:
#     endpoint: https://<你的账户>.codesigning.azure.net/
#     certificateProfileName: <Profile 名>
#     codeSigningAccountName: <账户名>
#     subscriptionId: <订阅 ID>
#     resourceGroupName: <资源组>
#     timestampDigest: sha256
#     timestampUrl: http://timestamp.acs.microsoft.com

win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: MingDao Harness
  artifactName: mingdao-setup-${version}-${arch}.${ext}
  # 安装器/卸载器图标默认即应用图标（build/icon.png 由 electron-builder 转 ico）——
  # 曾显式指定 installerIcon: png 导致 NSIS 打包失败（该字段要求 .ico），已移除

mac:
  target:
    - dmg
    - zip # 自动更新需要 zip（MacUpdater 差分/全量下载），dmg 供手动安装
  category: public.app-category.developer-tools
  icon: build/icon.png
  # 签名 + 公证（2026-09-01 接入 Developer ID）：CI 的 macOS runner 用 CSC_LINK/CSC_KEY_PASSWORD
  # 自动签名；notarize + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID 走 notarytool 公证并 stapling。
  # 未配置 Secrets 时这些字段不生效（构建回退未签名，行为与历史一致）。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

linux:
  executableName: mingdao
  target:
    - AppImage
    - deb
  # 审计（桌面图标两个齿根因）：app-builder 对单张 PNG 的尺寸检测返回 0，deb/AppImage 把
  # 图标装进 hicolor/0x0/（主题查不到 → 回退通用齿轮图标）。改用「尺寸命名目录」后
  # app-builder 按文件名取尺寸（16..512 七档），.desktop Icon=mingdao 正常命中。
  icon: build/icons
  category: Development
  maintainer: MingDaoTCM
  artifactName: mingdao-${version}-${arch}.${ext}

dmg:
  artifactName: mingdao-${version}-${arch}.${ext}
