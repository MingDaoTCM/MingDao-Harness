<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MingDao 明道</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1115">
<style>
:root{
  --bg:#0f1115; --bg2:#171a21; --bg3:#1f242e; --border:#2a303c;
  --text:#e6e9ef; --dim:#9aa3b2; --faint:#5c6675;
  --accent:#3ddc97; --accent2:#22b8cf; --warn:#e8b93d; --err:#e5534b;
  --user:#1f3d57; --code:#11141a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg2);flex:none;flex-wrap:wrap}
header .logo{font-weight:700;font-size:16px;color:var(--accent);letter-spacing:.5px}
header .logo span{color:var(--text)}
header .badge{font-size:12px;color:var(--dim);background:var(--bg3);border:1px solid var(--border);padding:2px 10px;border-radius:20px}
#sessionSearch{flex:1;min-width:90px;max-width:220px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px}
#modelSel,#permSel,#sessions{max-width:210px;min-width:0}
@media (max-width:860px){main{padding:14px 0 8px}#chat{padding:0 10px}#envBadge{display:none!important}#sessionSearch{max-width:150px}}
#sessionSearch:focus{outline:none;border-color:var(--accent2)}
#tasksPanel{position:fixed;right:0;top:52px;bottom:0;width:280px;background:var(--bg2);border-left:1px solid var(--border);z-index:40;display:flex;flex-direction:column}
.tp-head{padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);color:var(--accent2)}
.tp-head span{color:var(--faint);font-weight:400;font-size:12px}
#tpList{flex:1;overflow-y:auto;padding:8px}
.tp-item{padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:12.5px;background:var(--bg3)}
.tp-item .tp-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-item .tp-meta{color:var(--faint);font-size:11.5px;margin-top:3px;display:flex;gap:6px;align-items:center}
.tp-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tp-run{background:var(--accent);animation:blink 1.2s infinite}
.tp-done{background:var(--accent2)}
.tp-bad{background:var(--err)}
@keyframes blink{50%{opacity:.35}}
header .spacer{flex:1}
select,button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
select:hover,button:hover{border-color:var(--accent2)}
button.primary{background:var(--accent);color:#06231a;border:none;font-weight:600}
button.danger{background:var(--err);color:#fff;border:none}
button:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;overflow-y:auto;padding:18px 0 12px;min-width:0}
#chat{max-width:860px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:18px}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{background:var(--user);border:1px solid #2c4a66;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:78%;white-space:pre-wrap;word-break:break-word}
.msg-ai{display:flex;flex-direction:column;gap:10px}
.msg-ai .content{white-space:normal;word-break:break-word}
.msg-ai .content h1,.msg-ai .content h2,.msg-ai .content h3{font-size:1.05em;margin:.6em 0 .3em;color:var(--accent2)}
.msg-ai .content h4{font-size:1em;margin:.5em 0 .2em}
.msg-ai .content p{margin:.35em 0}
.msg-ai .content ul,.msg-ai .content ol{margin:.3em 0;padding-left:1.4em}
.msg-ai .content li{margin:.15em 0}
.msg-ai .content blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--border);color:var(--dim)}
.msg-ai .content code{background:var(--code);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#7ee0b8}
.msg-ai .content pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:.5em 0}
.msg-ai .content pre code{background:none;border:none;padding:0;color:#c8d3e0}
.msg-ai .content a{color:var(--accent2)}
.msg-ai .content .hl-kw{color:#7aa2f7;font-weight:600}.hl-s{color:#9ece6a}.hl-n{color:#e0af68}.hl-c{color:#565f6e;font-style:italic}.hl-f{color:#7dcfff}
.reasoning{margin:6px 0;border:1px dashed var(--border);border-radius:10px;background:var(--bg2)}
.reasoning summary{cursor:pointer;color:var(--faint);font-size:12.5px;padding:6px 12px;list-style:none}
.reasoning summary:after{content:"（点击展开）";margin-left:6px}
.reasoning[open] summary:after{content:""}
.reasoning .body{padding:8px 12px;color:var(--dim);font-size:13px;white-space:pre-wrap;max-height:260px;overflow-y:auto;border-top:1px solid var(--border)}
.tool{border:1px solid var(--border);border-radius:10px;background:var(--bg2);overflow:hidden;margin:8px 0}
.tool .head{padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.tool .head .ico{width:22px;text-align:center}
.tool .head .name{font-weight:600;color:#8ab4f8}
.tool .head .args{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .head .st{font-size:12px;color:var(--dim)}
.tool .head .st.ok{color:var(--accent)}.tool .head .st.bad{color:var(--err)}
.tool .body{border-top:1px solid var(--border);padding:10px 14px;font-size:12.8px;overflow-x:auto}
.tool .body pre{margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.diff .l{display:block;padding:0 6px;border-radius:3px;white-space:pre-wrap}
.diff .del{background:rgba(229,83,75,.12);color:#ff8f88}
.diff .add{background:rgba(61,220,151,.12);color:#7ee2b8}
.diff .ctx{color:var(--faint)}
.todo{list-style:none;margin:6px 0;padding:0 4px}
.todo li{padding:4px 0;color:var(--dim);display:flex;gap:8px}
.todo li.done{color:var(--faint);text-decoration:line-through}
.todo li.doing{color:var(--accent2)}
.usage{font-size:12px;color:var(--faint);border-top:1px dashed var(--border);padding-top:6px}
.banner{text-align:center;color:var(--faint);font-size:12.5px}
.errline{color:var(--err);background:rgba(229,83,75,.08);border:1px solid rgba(229,83,75,.3);border-radius:10px;padding:10px 14px;font-size:13.5px}
footer{flex:none;border-top:1px solid var(--border);background:var(--bg2);padding:12px 18px}
#composer{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:10px 14px;font:14px/1.6 inherit;resize:none;min-height:44px;max-height:200px}
#input:focus{outline:none;border-color:var(--accent2)}
#hint{font-size:11.5px;color:var(--faint);margin-top:6px;max-width:860px;margin-left:auto;margin-right:auto}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:min(520px,92vw);padding:18px}
.modal h3{margin:0 0 8px;font-size:15px;color:var(--warn)}
.modal .q{color:var(--text);font-size:14px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;margin-bottom:14px}
.modal .opts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.modal .opts button{text-align:left}
.cfg-row{margin:12px 0}
.cfg-row label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.cfg-row select,.cfg-row input[type=number]{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
.cfg-hint{font-size:12px;color:var(--faint);margin-top:4px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo">MingDao <span>明道</span></div>
  <select id="modelSel" title="切换模型"></select>
  <select id="permSel" title="权限模式">
    <option value="ask">权限 ask</option>
    <option value="auto">权限 auto</option>
    <option value="readonly">权限 readonly</option>
  </select>
  <span id="cfgMsg" class="badge" style="display:none"></span>
  <span class="badge" id="envBadge"></span>
  <button id="cfgBtn" title="设置">⚙</button>
  <div class="spacer"></div>
  <input id="sessionSearch" placeholder="搜索会话…" title="关键词检索历史会话">
  <select id="sessions" title="历史会话"><option value="">＋ 新会话</option></select>
  <button id="tasksBtn" title="任务面板">任务</button><button id="sessMgrBtn" title="管理会话（重命名/删除）">✎</button>
  <button id="newChat">新对话</button>
  <button id="stopBtn" class="danger" style="display:none">■ 中断</button>
</header>
<aside id="tasksPanel" style="display:none">
  <div class="tp-head">任务面板 <span id="tpCount"></span><button id="tpClose" style="float:right">✕</button></div>
  <div id="tpList"></div>
</aside>
<main><div id="chat"></div></main>
<footer>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="输入任务…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn" class="primary">发送</button>
  </div>
  <div id="hint">工具执行与权限确认会实时展示；生成中可点「中断」停止。</div>
</footer>
<div id="modalRoot"></div>
<div id="sessModal" class="modal-mask" style="display:none">
  <div class="modal">
    <h3>会话管理（重命名 / 删除）</h3>
    <div id="sessList" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px 8px"></div>
    <div class="row" style="margin-top:12px"><button id="sessClose">关闭</button></div>
  </div>
</div>
<div id="cfgModal" class="modal-mask" style="display:none">
  <div class="modal">
    <h3>⚙ 设置</h3>
    <div class="cfg-row"><label>沙箱模式（bash 执行隔离）</label>
      <select id="sbxSel">
        <option value="off">off — 直接执行</option>
        <option value="readonly">readonly — 全盘只读（/tmp 可写）</option>
        <option value="safe">safe — 只读 + 断网（最安全）</option>
      </select>
      <div class="cfg-hint" id="sbxHint"></div>
    </div>
    <div class="cfg-row"><label><input type="checkbox" id="routeChk"> 自动模型路由（规划→pro / 执行→flash）</label></div>
    <div class="cfg-row"><label>上下文预算 tokens <input type="number" id="budgetInput" min="1000" step="1000"></label></div>
    <div class="cfg-row"><label><input type="checkbox" id="autoStartChk"> 开机自启（登录后自动启动服务器）</label></div>
    <div class="cfg-row"><label><input type="checkbox" id="notifyChk"> 后台任务完成/失败时桌面通知</label></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0 8px">
    <h4 style="margin:4px 0;color:var(--accent2)">调度队列（定时 / 周期 / 依赖）</h4>
    <div id="schList" style="max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:2px 8px"></div>
    <div class="cfg-row" style="display:flex;gap:6px;flex-wrap:wrap">
      <input id="schQuestion" placeholder="定时任务内容…" style="flex:1;min-width:130px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px">
      <select id="schWhen" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px">
        <option value="at">定时一次</option><option value="every">周期</option><option value="after">依赖任务ID</option><option value="chain">链式（每行一个任务）</option>
      </select>
    </div>
    <div class="cfg-row" id="schAtRow"><input type="datetime-local" id="schAt" style="width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px"></div>
    <div class="cfg-row" id="schEveryRow" style="display:none">
      <select id="schEvery" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px">
        <option value="30s">每 30 秒</option><option value="5m">每 5 分钟</option><option value="1h">每 1 小时</option><option value="1d">每 1 天</option>
      </select>
    </div>
    <div class="cfg-row" id="schAfterRow" style="display:none"><input id="schAfter" placeholder="任务 ID（mingdao run 返回）或调度 ID" style="width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px"></div>
    <div class="cfg-row" id="schChainRow" style="display:none"><textarea id="schChain" rows="4" placeholder="每行一个任务，按顺序执行（后者依赖前者成功）&#10;构建&#10;测试&#10;部署" style="width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;resize:vertical"></textarea></div>
    <div class="row"><button id="schAdd">＋ 添加调度</button></div>
    <div class="row"><button id="cfgCancel">取消</button><button class="primary" id="cfgSave">保存</button></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const chatEl = $('#chat'), input = $('#input'), sendBtn = $('#sendBtn'), stopBtn = $('#stopBtn');
let currentSession = null, thinking = null;

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function highlight(code, lang){
  const kws = new Set('const let var function return if else for while import from export class new await async try catch throw null undefined true false def elif raise with as lambda None True False self echo exit if then else fi done local function'.split(' '));
  const re = /(\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'[^']*'|`[^`]*`|\b\d[\d._]*\b|[A-Za-z_$][\w$]*)/g;
  return esc(code).replace(re, (tok)=>{
    if(tok.startsWith('//')||tok.startsWith('#')) return '<span class="hl-c">'+tok+'</span>';
    if(/^["'`]/.test(tok)) return '<span class="hl-s">'+tok+'</span>';
    if(/^\d/.test(tok)) return '<span class="hl-n">'+tok+'</span>';
    if(kws.has(tok)) return '<span class="hl-kw">'+tok+'</span>';
    return tok;
  });
}
function renderMarkdown(text){
  const lines = String(text).split('\n'); let out='', code=null, codeLang='';
  const flush=()=>{ if(code!==null){ out+='<pre><code class="lang-'+codeLang+'">'+highlight(code.join('\n'),codeLang)+'</code></pre>'; code=null; } };
  for(const line of lines){
    if(line.trim().startsWith('```')){
      if(code===null){ code=[]; codeLang=(line.trim().slice(3).trim().split(/\s+/)[0]||''); }
      else flush();
      continue;
    }
    if(code!==null){ code.push(line); continue; }
    let l = esc(line);
    l = l.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
    l = l.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    if(/^#{1,6}\s/.test(line.trim())){ const m=line.trim().match(/^(#+)\s+(.*)/); l='<h'+(m[1].length>3?3:m[1].length)+'>'+m[2]+'</h'+'>'; }
    else if(/^\s*[-*+]\s/.test(line)) l='• '+l.replace(/^\s*[-*+]\s/,'');
    else if(/^\s*\d+[.)]\s/.test(line)) l=l.replace(/^\s*(\d+)[.)]\s/,'<b>$1.</b> ');
    else if(/^>\s?/.test(line)) l='<blockquote>'+l.replace(/^>\s?/,'')+'</blockquote>';
    out+= l+'<br>';
  }
  flush();
  return out;
}
function scrollBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

function newAiMsg(){ const el=document.createElement('div'); el.className='msg-ai'; chatEl.appendChild(el); scrollBottom(); return el; }
function aiContent(msg){ const c=msg.querySelector('.content'); return c || (()=>{const d=document.createElement('div');d.className='content';msg.appendChild(d);return d;})(); }
function addReasoning(msg){ const d=document.createElement('details'); d.className='reasoning'; d.innerHTML='<summary>思考过程</summary><div class="body"></div>'; msg.appendChild(d); return d.querySelector('.body'); }

function addUser(text){ const el=document.createElement('div'); el.className='msg-user'; el.innerHTML='<div class="bubble">'+esc(text)+'</div>'; chatEl.appendChild(el); scrollBottom(); }

function renderToolEvent(ev){
  const msg = newAiMsg();
  const card=document.createElement('div'); card.className='tool';
  const ico = {'read':'📄','write':'✏️','edit':'✎','bash':'⚙','grep':'🔎','glob':'🔎','ls':'📁','task':'👥','skill':'🧩','todo':'☑','undo':'↩'}[ev.name]||'🔌';
  const args = ev.name==='bash'? (ev.args&&ev.args.command):(ev.args&&(ev.args.path||ev.args.pattern||''))||'';
  card.innerHTML='<div class="head"><span class="ico">'+ico+'</span><span class="name">'+esc(ev.name)+'</span><span class="args">'+esc(args)+'</span><span class="st '+(ev.result&&ev.result.ok!==false?'ok':'bad')+'">'+(ev.result&&ev.result.ok!==false?'✓':'✖')+(ev.durationMs!=null?' '+ev.durationMs+'ms':'')+'</span></div>';
  if(ev.result){
    const body=document.createElement('div'); body.className='body';
    const r=ev.result;
    if(ev.name==='edit'&&r.diff){
      body.classList.add('diff');
      const a=(r.diff.before||'').split('\n'), b=(r.diff.after||'').split('\n');
      const n=Math.max(a.length,b.length);
      for(let i=0;i<n;i++){
        if(a[i]===b[i]) body.insertAdjacentHTML('beforeend','<span class="l ctx"> '+esc(a[i]??'')+'</span>');
        else{ if(a[i]!==undefined) body.insertAdjacentHTML('beforeend','<span class="l del">- '+esc(a[i])+'</span>'); if(b[i]!==undefined) body.insertAdjacentHTML('beforeend','<span class="l add">+ '+esc(b[i])+'</span>'); }
      }
    }else if(ev.name==='write'&&r.ok){
      const lines=String(ev.args&&ev.args.content||'').split('\n');
      body.innerHTML='<pre>'+esc(lines.slice(0,8).join('\n'))+(lines.length>8?'\n…（共 '+lines.length+' 行）':'')+'</pre>';
    }else if(ev.name==='bash'&&r.ok){
      body.innerHTML='<b style="color:'+(r.exitCode===0?'var(--accent)':'var(--err)')+'">'+(r.timedOut?'⏱ 超时':'exit '+r.exitCode)+'</b>'+(r.stdout?'<pre>'+esc(r.stdout.slice(-4000))+'</pre>':'')+(r.stderr?'<pre style="color:#ff9d97">'+esc(r.stderr.slice(-1500))+'</pre>':'');
    }else if(r.output){
      body.innerHTML='<pre>'+esc(String(r.output).slice(0,4000))+'</pre>';
    }else if(r.error){ body.innerHTML='<span style="color:var(--err)">'+esc(r.error)+'</span>'; }
    card.appendChild(body);
  }
  msg.appendChild(card);
  if(ev.name==='todo'&&ev.result&&ev.result.todos) renderTodos(ev.result.todos, msg);
  scrollBottom();
}
function renderTodos(todos,msg){
  const ul=document.createElement('ul'); ul.className='todo';
  for(const t of todos){ const li=document.createElement('li'); li.className=t.status==='completed'?'done':t.status==='in_progress'?'doing':''; li.innerHTML=(t.status==='completed'?'✓ ':'○ ')+esc(t.content); ul.appendChild(li); }
  msg.appendChild(ul);
}
function renderBanner(ev){ const d=document.createElement('div'); d.className='banner'; d.textContent=ev.text||ev.title||''; chatEl.appendChild(d); scrollBottom(); }

function askModal(ev){
  return new Promise(resolve=>{
    const root=$('#modalRoot');
    const mask=document.createElement('div'); mask.className='modal-mask';
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML='<h3>权限确认</h3><div class="q">'+esc(ev.question)+'</div><div class="opts"></div><div class="row"><button class="danger" data-a="n">拒绝</button><button class="primary" data-a="y">允许</button></div>';
    if(ev.options&&ev.options.length){ m.querySelector('.opts').style.display='flex'; ev.options.forEach(o=>{ const b=document.createElement('button'); b.dataset.a=o.value; b.textContent=o.label||o.value; b.onclick=()=>finish(o.value); m.querySelector('.opts').appendChild(b); }); m.querySelector('.row').style.display='none'; }
    m.querySelectorAll('[data-a]').forEach(b=>{ if(!b.onclick) b.onclick=()=>finish(b.dataset.a); });
    function finish(a){ mask.remove(); resolve(a); }
    mask.appendChild(m); root.appendChild(mask);
  });
}

async function handleEvents(stream, onEvent){
  const reader=stream.getReader(); const dec=new TextDecoder(); let buf='';
  for(;;){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let nl; while((nl=buf.indexOf('\n'))>=0){ const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1); if(!line.startsWith('data:'))continue; try{ onEvent(JSON.parse(line.slice(5))); }catch{} }
  }
}

async function send(){
  const text=input.value.trim(); if(!text) return;
  input.value=''; input.style.height='44px';
  addUser(text);
  const msg=newAiMsg(); const content=aiContent(msg); let raw='';
  let reason=null; let taskId=null;
  const update=()=>{ content.innerHTML=renderMarkdown(raw); scrollBottom(); };
  const timer=setInterval(()=>{ if(raw) update(); },200);
  updateTasksPanel();
  try{
    const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,file:currentSession})});
    if(!resp.ok){ const j=await resp.json().catch(()=>({})); msg.innerHTML='<div class="errline">'+esc(j.error||('HTTP '+resp.status))+'</div>'; updateTasksPanel(); return; }
    await handleEvents(resp.body, ev=>{
      if(ev.taskId) taskId=ev.taskId;
      if(ev.type==='text'){ raw+=ev.delta; }
      else if(ev.type==='reasoning'){ if(!reason) reason=addReasoning(msg); reason.textContent+=ev.delta; }
      else if(ev.type==='code'){ const pre=document.createElement('pre'); pre.innerHTML='<code>'+highlight(ev.code,ev.lang)+'</code>'; content.appendChild(pre); }
      else if(ev.type==='tool'){ update(); renderToolEvent(ev); }
      else if(ev.type==='toolDenied'){ const d=document.createElement('div'); d.className='errline'; d.textContent='✖ 未授权：'+ev.name; msg.appendChild(d); }
      else if(ev.type==='banner'){ renderBanner(ev); }
      else if(ev.type==='ask'){ update(); askModal(ev).then(a=>fetch('/api/permission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ev.id,answer:a,taskId})}).catch(()=>{})); }
      else if(ev.type==='usage'){ const u=document.createElement('div'); u.className='usage'; u.textContent=''+ev.modelName+' · ↑'+ev.usage.prompt_tokens+' ↓'+ev.usage.completion_tokens+' tokens · '+((ev.durationMs||0)/1000).toFixed(1)+'s'+ev.cost; content.appendChild(u); }
      else if(ev.type==='error'){ const d=document.createElement('div'); d.className='errline'; d.textContent=ev.message; msg.appendChild(d); }
      else if(ev.type==='done'){ currentSession=ev.session; update(); refreshSessions(); updateTasksPanel(); }
    });
  }catch(e){ msg.innerHTML='<div class="errline">'+esc(e.message||'网络错误')+'</div>'; }
  finally{ clearInterval(timer); update(); updateTasksPanel(); }
}

function abort(){ fetch('/api/abort',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(()=>{}); }

// —— 任务面板（多会话并行） ——
async function updateTasksPanel(){
  const r=await fetch('/api/tasks').catch(()=>null); if(!r) return;
  const j=await r.json(); const list=$('#tpList'); list.innerHTML='';
  $('#tpCount').textContent='（'+j.running+' 运行中 / 上限 '+j.maxConcurrent+'）';
  for(const t of j.tasks){
    const div=document.createElement('div'); div.className='tp-item';
    const dot = t.status==='running'?'tp-run':(t.status==='done'?'tp-done':'tp-bad');
    const secs = t.status==='running'?'…':' '+(t.durationMs/1000).toFixed(1)+'s';
    div.innerHTML='<div class="tp-title">'+esc(t.message||'任务')+'</div><div class="tp-meta"><span class="tp-dot '+dot+'"></span>'+t.status+secs+'</div>';
    if(t.status==='running'){ const b=document.createElement('button'); b.textContent='中断'; b.className='danger'; b.style.cssText='margin-left:auto;padding:2px 8px;font-size:11px'; b.onclick=()=>fetch('/api/abort',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId:t.id})}).catch(()=>{}); div.querySelector('.tp-meta').appendChild(b); }
    list.appendChild(div);
  }
}
setInterval(updateTasksPanel, 2000);
$('#tasksBtn').onclick=()=>{ const p=$('#tasksPanel'); p.style.display = p.style.display==='none'?'flex':'none'; if(p.style.display==='flex') updateTasksPanel(); };
$('#tpClose').onclick=()=>{ $('#tasksPanel').style.display='none'; };

async function refreshSessions(q){ const u=q?'/api/sessions?q='+encodeURIComponent(q):'/api/sessions'; const r=await fetch(u).catch(()=>null); if(!r)return; const j=await r.json(); const sel=$('#sessions'); sel.innerHTML='<option value="">＋ 新会话</option>'; for(const s of j.sessions){ const o=document.createElement('option'); o.value=s.file; o.textContent=s.label; sel.appendChild(o); } if(currentSession&&!q) sel.value=currentSession; }
let searchTimer=null;
$('#sessionSearch').addEventListener('input',e=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>refreshSessions(e.target.value.trim()),300); });
async function init(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'}); const j=await r.json();
    const ms=$('#modelSel'); ms.innerHTML='';
    const groups={}; const order=[];
    for(const m of (j.models||[])){ const g=m.providerLabel||'其他'; if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(m); }
    for(const g of order){
      const og=document.createElement('optgroup'); og.label=g;
      for(const m of groups[g]){ const o=document.createElement('option'); o.value=m.name; o.textContent=m.label; if(m.name===j.model) o.selected=true; og.appendChild(o); }
      ms.appendChild(og);
    }
    if(!(j.models||[]).length){ const o=document.createElement('option'); o.value=j.model; o.textContent=j.model; ms.appendChild(o); }
    $('#permSel').value=j.permission||'ask';
    $('#sbxSel').value=j.sandbox||'off';
    $('#sbxHint').textContent=j.sandboxSupported?'':'当前环境未检测到 bubblewrap，readonly/safe 将自动降级为 off';
    $('#routeChk').checked=Boolean(j.routing);
    $('#budgetInput').value=j.contextBudget||128000;
    $('#autoStartChk').checked=Boolean(j.autostart);
    $('#notifyChk').checked=j.notify!==false;
    const env = (j.workspace?'工作空间 '+j.workspace+' · ':'')+(j.routing?'路由开 · ':'')+(j.sandbox&&j.sandbox!=='off'?(j.sandboxSupported?'沙箱'+j.sandbox:'沙箱降级'):'');
    $('#envBadge').textContent=env; $('#envBadge').style.display=env?'':'none';
  }catch(e){
    const ms=$('#modelSel'); if(!ms.options.length){ const o=document.createElement('option'); o.textContent='加载失败，刷新重试'; ms.appendChild(o); }
  }
  refreshSessions();
  try{
    const dr=await fetch('/api/draft',{cache:'no-store'}); const dj=await dr.json();
    if(dj.text){ input.value=dj.text; input.style.height=Math.min(input.scrollHeight,200)+'px'; input.focus(); }
  }catch(e){}
}
$('#cfgBtn').onclick=()=>{ $('#cfgModal').style.display='flex'; };
$('#cfgCancel').onclick=()=>{ $('#cfgModal').style.display='none'; };
$('#cfgBtn').addEventListener('click', refreshSchList);
$('#schWhen').onchange=e=>{ const v=e.target.value; $('#schAtRow').style.display=v==='at'?'':'none'; $('#schEveryRow').style.display=v==='every'?'':'none'; $('#schAfterRow').style.display=v==='after'?'':'none'; $('#schChainRow').style.display=v==='chain'?'':'none'; };
async function refreshSchList(){
  const r=await fetch('/api/schedule',{cache:'no-store'}).catch(()=>null); if(!r) return;
  const j=await r.json(); const list=$('#schList'); list.innerHTML='';
  if(!j.jobs||!j.jobs.length){ list.innerHTML='<div style="color:var(--faint);font-size:12px;padding:6px 2px">暂无调度任务</div>'; return; }
  for(const s of j.jobs){
    const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px';
    const mark=s.status==='running'?'▶':s.status==='paused'?'⏸':s.status==='done'?'✓':s.status==='skipped'?'⊘':'⏳';
    const when=s.kind==='every'?('每 '+(s.interval>=86400000?(s.interval/86400000)+'d':s.interval>=3600000?(s.interval/3600000)+'h':s.interval>=60000?(s.interval/60000)+'m':(s.interval/1000)+'s')):s.kind==='once'?(s.nextRunAt?new Date(s.nextRunAt).toLocaleString():''):('依赖 '+ (s.after||[]).join(','));
    div.innerHTML='<span>'+mark+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.question)+'</span><span style="color:var(--faint);white-space:nowrap">'+esc(when)+' · '+s.runs+'次</span>';
    if((s.history||[]).length){ const hb=document.createElement('button'); hb.textContent='历史('+s.history.length+')'; hb.style.cssText='padding:1px 8px;font-size:11px'; const hist=document.createElement('div'); hist.style.cssText='display:none;padding:4px 0 4px 18px;font-size:11.5px;color:var(--dim)'; for(const h of s.history.slice(-8).reverse()){ hist.innerHTML+='<div>· '+new Date(h.at).toLocaleTimeString()+' '+(h.status==='done'?'✓':'✖')+' '+(h.durationMs!=null?(h.durationMs/1000).toFixed(1)+'s':'')+' '+esc((h.text||'').slice(0,60))+'</div>'; } hb.onclick=()=>{ hist.style.display=hist.style.display==='none'?'block':'none'; }; div.parentElement.insertBefore(hist, div.nextSibling); div.appendChild(hb); }
    if(s.status!=='done'&&s.status!=='skipped'){ const pa=document.createElement('button'); pa.textContent=s.status==='paused'?'恢复':'暂停'; pa.style.cssText='padding:1px 8px;font-size:11px'; pa.onclick=()=>schAction(s.status==='paused'?'resume':'pause', s.id); div.appendChild(pa); }
    const rm=document.createElement('button'); rm.textContent='删除'; rm.className='danger'; rm.style.cssText='padding:1px 8px;font-size:11px'; rm.onclick=()=>schAction('remove', s.id); div.appendChild(rm);
    list.appendChild(div);
  }
}
async function schAction(action,id){ await fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id})}); refreshSchList(); }
$('#schAdd').onclick=async ()=>{
  const q=$('#schQuestion').value.trim(); if(!q) return;
  const kind=$('#schWhen').value;
  const payload={action:'add',question:q};
  if(kind==='at'){ const v=$('#schAt').value; if(!v) return; payload.at=v.replace('T',' '); }
  else if(kind==='every'){ payload.every=$('#schEvery').value; }
  else if(kind==='chain'){ const v=$('#schChain').value.trim(); if(!v) return; const qs=v.split('\n').map(x=>x.trim()).filter(Boolean); if(qs.length<2){ alert('链式需要至少两行任务'); return; } payload.action='chain'; payload.questions=qs; }
  else { const v=$('#schAfter').value.trim(); if(!v) return; payload.after=[v]; }
  const r=await fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({error:'请求失败'}));
  if(j.ok){ $('#schQuestion').value=''; refreshSchList(); } else { alert(j.error||'添加失败'); }
};
$('#cfgSave').onclick=()=>{ applyConfig({sandbox:$('#sbxSel').value, routing:$('#routeChk').checked, contextBudget:Number($('#budgetInput').value), autostart:$('#autoStartChk').checked, notify:$('#notifyChk').checked}); $('#cfgModal').style.display='none'; };
async function applyConfig(payload, revertTarget){
  const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({error:'请求失败'}));
  const m=$('#cfgMsg');
  if(j.ok){
    if(payload.model!==undefined) m.textContent='✓ 已切换 '+j.model;
    else if(payload.permission!==undefined) m.textContent='✓ 权限 '+j.permission;
    else m.textContent='✓ 设置已保存';
    m.style.color='var(--accent)';
  }else{
    m.textContent='✖ '+j.error; m.style.color='var(--err)';
    if(revertTarget){
      const st=await fetch('/api/state',{cache:'no-store'});
      const sj=await st.json();
      revertTarget.value=revertTarget.id==='modelSel'?sj.model:sj.permission;
    }
  }
  m.style.display=''; setTimeout(()=>{m.style.display='none';},4000);
}
$('#modelSel').addEventListener('change', e=>{ applyConfig({model:e.target.value}, e.target); });
$('#permSel').addEventListener('change', e=>{ applyConfig({permission:e.target.value}, e.target); });
async function loadSession(file){ currentSession=file; chatEl.innerHTML=''; const r=await fetch('/api/session?file='+encodeURIComponent(file)); const j=await r.json(); for(const m of j.messages||[]){ if(m.role==='user') addUser(m.content); else { const el=newAiMsg(); aiContent(el).innerHTML=renderMarkdown(m.content); } } scrollBottom(); }

sendBtn.onclick=send; stopBtn.onclick=abort;
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
input.addEventListener('input',()=>{ input.style.height='44px'; input.style.height=Math.min(input.scrollHeight,200)+'px'; });
$('#newChat').onclick=()=>{ currentSession=null; chatEl.innerHTML=''; refreshSessions(); };
$('#sessMgrBtn').onclick=openSessModal;
$('#sessClose').onclick=()=>{ $('#sessModal').style.display='none'; };
async function openSessModal(){
  $('#sessModal').style.display='flex';
  const r=await fetch('/api/sessions',{cache:'no-store'}); const j=await r.json();
  const list=$('#sessList'); list.innerHTML='';
  if(!j.sessions.length){ list.innerHTML='<div style="color:var(--faint);font-size:12px;padding:6px">暂无会话</div>'; return; }
  for(const s of j.sessions){
    const div=document.createElement('div'); div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px';
    div.innerHTML='<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.label)+'</span>';
    const rn=document.createElement('button'); rn.textContent='重命名'; rn.style.cssText='padding:1px 8px;font-size:11px'; rn.onclick=async()=>{ const t=prompt('新标题：', s.file.replace(/\.jsonl$/,'')); if(!t) return; const rr=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'rename',file:s.file,title:t})}); const jj=await rr.json().catch(()=>({error:'失败'})); if(jj.ok){ refreshSessions(); openSessModal(); } else alert(jj.error||'重命名失败'); };
    const dl=document.createElement('button'); dl.textContent='删除'; dl.className='danger'; dl.style.cssText='padding:1px 8px;font-size:11px'; dl.onclick=async()=>{ if(!confirm('删除会话 '+s.file+'？此操作不可恢复。')) return; const rr=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',file:s.file})}); const jj=await rr.json().catch(()=>({error:'失败'})); if(jj.ok){ if(currentSession===s.file) currentSession=null; refreshSessions(); openSessModal(); } else alert(jj.error||'删除失败'); };
    div.appendChild(rn); div.appendChild(dl); list.appendChild(div);
  }
}
$('#sessions').onchange=e=>{ if(e.target.value){ loadSession(e.target.value); } else { currentSession=null; chatEl.innerHTML=''; } };
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
init();
</script>
