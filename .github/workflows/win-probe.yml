name: WinProbe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: workspace-fence
        shell: bash
        run: |
          set +e
          node test/workspace-fence.js > /tmp/ws.log 2>&1
          code=$?
          echo "exit=$code"
          cat /tmp/ws.log
          tail -40 /tmp/ws.log | tr '\n' ' ' | tr -d '\r' > /tmp/ws.tail
          printf '::error title=workspace-fence::exit=%s :: ' "$code"
          cat /tmp/ws.tail
          echo
