name: WinProbe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: changed batches on Windows
        shell: bash
        run: |
          set +e
          for b in batch36 batch38 batch41 batch49 batch72 batch73 batch74; do
            node test/mutate/run.mjs $b > /tmp/$b.log 2>&1; c=$?
            echo "== $b exit=$c =="
            grep -E "^✗|批次：|变异验证" /tmp/$b.log | tail -8
            printf '::error title=%s::exit=%s :: %s\n' "$b" "$c" "$(grep -E '^✗' /tmp/$b.log | head -4 | tr '\n' ' ' | tr -d '\r')"
          done
          exit 0
