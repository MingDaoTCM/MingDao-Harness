# MingDao-Harness CI：Ubuntu(18/20/22) + Windows + macOS 三平台矩阵跑全部四套测试（全部离线，无需任何密钥）。
# Windows 平台缺陷（评估 D1–D5）此前因 CI 只有 Linux 而结构性无法发现，现永久守住。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 冒烟测试（40+ 组断言）
        run: node test/smoke.js
      - name: 评测基准回归（tokenizer/routing/compaction）
        run: npm run bench
      - name: 全量 strict 棘轮（错误数只降不升）
        run: node scripts/strict-ratchet.mjs
      - name: 覆盖率门禁（V8 行覆盖率 ≥60%）
        if: runner.os == 'Linux' && matrix.node == 20
        run: npm run coverage
      - name: 端到端：本地 Agent / 同步 / 分享
        run: node test/e2e-local.js
      - name: 端到端：WebUI HTTP/SSE/权限/访问控制
        run: node test/e2e-web.js
      - name: 端到端：调度
        run: node test/e2e-schedule.js
      - name: API 域契约测试（7 域路由契约 + body 上限）
        run: node test/api-contracts.js
      - name: 安装类型检查依赖（typescript + @types/node）
        run: npm ci --no-audit --no-fund
      - name: 类型门禁（tsc --checkJs 全量严格，与 strict 棘轮同一 tsconfig.full.json）
        run: npx tsc -p tsconfig.full.json
