# MingDao-Harness CI：Ubuntu(18/20/22) + Windows + macOS 三平台矩阵跑全部四套测试（全部离线，无需任何密钥）。
# Windows 平台缺陷（评估 D1–D5）此前因 CI 只有 Linux 而结构性无法发现，现永久守住。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 冒烟测试（40+ 组断言）
        run: node test/smoke.js
      - name: 端到端：本地 Agent / 同步 / 分享
        run: node test/e2e-local.js
      - name: 端到端：WebUI HTTP/SSE/权限/访问控制
        run: node test/e2e-web.js
      - name: 端到端：调度
        run: node test/e2e-schedule.js
