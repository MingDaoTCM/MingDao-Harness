# MingDao 桌面版打包：打 tag 自动构建三平台安装包 → 上传工件 + 自动创建 GitHub Release
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 自动创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            name: linux-x64
          - os: windows-latest
            args: --win nsis
            name: win-x64
          # macos-13 公共池已基本退役（排队数小时），Intel 版改用 macos-14(arm64) + Rosetta 交叉构建 x64
          - os: macos-14
            args: --mac dmg --x64
            name: mac-x64
          - os: macos-14
            args: --mac dmg
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      # 代码签名/公证（可选）：在仓库 Secrets 配置后自动生效，未配置时构建未签名产物
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Electron 依赖（npmmirror 镜像）
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        shell: bash
        run: |
          # 未配置的签名 Secrets 会被 Actions 替换为空字符串，electron-builder 将空串视为有效证书路径而快速报错——先清空再构建
          for k in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!k}" ]; then unset "$k"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish never
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: mingdao-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: warn
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          draft: false
          generate_release_notes: true
