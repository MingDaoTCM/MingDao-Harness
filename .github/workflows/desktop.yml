# MingDao 桌面版打包：打 tag 自动构建三平台安装包 → 上传工件 + 自动创建 GitHub Release
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 自动创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            name: linux-x64
          - os: windows-latest
            args: --win nsis
            name: win-x64
          # macos-13 公共池已基本退役（排队数小时），Intel 版改用 macos-14(arm64) + Rosetta 交叉构建 x64
          # zip 供自动更新（MacUpdater 全量/差分下载），dmg 供手动安装
          - os: macos-14
            args: --mac dmg zip --x64
            name: mac-x64
          - os: macos-14
            args: --mac dmg zip
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      # 代码签名/公证（可选）：在仓库 Secrets 配置后自动生效，未配置时构建未签名产物
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步桌面版版本号（与根 package.json 联动）
        working-directory: desktop
        run: node ../scripts/sync-versions.mjs
      - name: 安装 Electron 依赖（npmmirror 镜像）
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        shell: bash
        run: |
          # 未配置的签名 Secrets 会被 Actions 替换为空字符串，electron-builder 将空串视为有效证书路径而快速报错——先清空再构建
          for k in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!k}" ]; then unset "$k"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish never
      - name: 生成更新清单（GitHub 渠道 latest*.yml）
        working-directory: desktop
        run: node gen-update-yml.mjs
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: mingdao-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
          if-no-files-found: warn
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部工件
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 同版本重建（0.1.65 等）需要在同一 Release 上覆盖资产。softprops 的 update-a-release-asset
      # 在资产已存在/并发时偶发 404 导致发布失败——改用 gh CLI：清空旧资产后整批覆盖上传（--clobber）。
      # 失败时把真实错误写入工作流注解（check-runs API 可公开读取，便于无令牌诊断）。
      - name: 发布到 GitHub Release（清空旧资产后整批覆盖上传）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          echo "gh 版本：$(gh --version | head -1)"
          gh auth status 2>&1 | sed 's/^/auth: /' | head -6
          FILES=$(find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' \) | sort)
          echo "待上传："; echo "$FILES"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在：先清空旧资产"
            while IFS= read -r n; do
              echo "删除旧资产：$n"
              gh release delete-asset "$TAG" "$n" -R "$REPO" --yes > /tmp/del.out 2>&1 || echo "  （删除失败，忽略：$(tail -c 200 /tmp/del.out)）"
            done < <(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
            if gh release upload "$TAG" $FILES -R "$REPO" --clobber > /tmp/up.out 2>&1; then
              echo "上传成功"
            else
              echo "::error title=gh-release-upload::$(tail -c 1500 /tmp/up.out)"
              exit 1
            fi
          else
            echo "Release 不存在：创建并上传"
            if gh release create "$TAG" $FILES -R "$REPO" --generate-notes --title "$TAG" > /tmp/cr.out 2>&1; then
              echo "创建成功"
            else
              echo "::error title=gh-release-create::$(tail -c 1500 /tmp/cr.out)"
              exit 1
            fi
          fi
