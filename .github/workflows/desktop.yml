# MingDao 桌面版打包：打 tag 自动构建三平台安装包 → 上传工件 + 自动创建 GitHub Release
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 自动创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            name: linux-x64
          - os: windows-latest
            args: --win nsis
            name: win-x64
          - os: macos-13
            args: --mac dmg
            name: mac-x64
          - os: macos-14
            args: --mac dmg
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Electron 依赖（npmmirror 镜像）
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: mingdao-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: warn
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          draft: false
          generate_release_notes: true
