# MingDao 桌面版打包：打 tag 自动构建三平台安装包 → 上传工件 + 自动创建 GitHub Release
name: Desktop

on:
  workflow_dispatch:
    inputs:
      normalize_tag:
        description: '仅改写该 tag 的 Release 正文（如 v0.5.0）；留空则执行签名/公证验证构建'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write # 自动创建 Release 需要

jobs:
  build:
    # 正文规范化（normalize_tag 非空）时不必再跑三平台构建——那是几十分钟的纯浪费。
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.normalize_tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            name: linux-x64
          - os: windows-latest
            args: --win nsis
            name: win-x64
          # macos-13 公共池已基本退役（排队数小时），Intel 版改用 macos-14(arm64) + Rosetta 交叉构建 x64
          # zip 供自动更新（MacUpdater 全量/差分下载），dmg 供手动安装
          - os: macos-14
            args: --mac dmg zip --x64
            name: mac-x64
          - os: macos-14
            args: --mac dmg zip
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      # 代码签名/公证（可选）：在仓库 Secrets 配置后自动生效，未配置时构建未签名产物
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步桌面版版本号（与根 package.json 联动）
        working-directory: desktop
        run: node ../scripts/sync-versions.mjs
      - name: 安装 Electron 依赖（npmmirror 镜像）
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        shell: bash
        run: |
          # 未配置的签名 Secrets 会被 Actions 替换为空字符串，electron-builder 将空串视为有效证书路径而快速报错——先清空再构建
          for k in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!k}" ]; then unset "$k"; fi
          done
          # Apple Developer ID 证书只用于 macOS：非 macOS 腿强制清空 CSC_*，防止 electron-builder
          # 拿 Apple 证书给 Windows exe 做 Authenticode「签名」（产生无效签名，比不签更糟）
          if [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder ${{ matrix.args }} --publish never
      # 打包冒烟（0.2.2 事故护栏）：真实运行打包产物主进程（xvfb 无窗口），模块求值通过即退出 0。
      # 只跑 Linux 腿：导入缺失/路径错误这类 bug 平台无关，一个平台就足以拦截；三平台都跑浪费时长。
      - name: 打包冒烟（主进程模块求值，xvfb）
        if: runner.os == 'Linux'
        shell: bash
        env:
          MINGDAO_DESKTOP_SMOKE: '1'
        run: |
          cd desktop
          test -x dist/linux-unpacked/mingdao || { echo "缺少 dist/linux-unpacked/mingdao"; ls dist; exit 1; }
          xvfb-run -a dist/linux-unpacked/mingdao --no-sandbox
      - name: 生成更新清单（GitHub 渠道 latest*.yml）
        working-directory: desktop
        run: node gen-update-yml.mjs
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: mingdao-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
            # 差量更新（v0.6.2）：Windows NSIS 与 macOS zip 的 blockmap 是**独立文件**，
            # electron-updater 按 `<安装包 URL>.blockmap` 取（providers/Provider.js
            # getBlockMapFiles）。此前不上传 → 差量永远不触发、每次更新整包重下
            # （exe 76MB / mac zip 93–101MB）。Linux AppImage 的 blockmap 内嵌在文件尾部，
            # 不需要独立文件，但 feed 必须给出 blockMapSize。
            desktop/dist/*.blockmap
          if-no-files-found: warn
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 只允许 tag 触发的构建发版（workflow_dispatch 用于签名/公证验证，绝不创建 Release）
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部工件
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 同版本重建（0.1.65 等）需要在同一 Release 上覆盖资产。softprops 的 update-a-release-asset
      # 在资产已存在/并发时偶发 404 导致发布失败——改用 gh CLI：清空旧资产后整批覆盖上传（--clobber）。
      # 失败时把真实错误写入工作流注解（check-runs API 可公开读取，便于无令牌诊断）。
      - name: 发布到 GitHub Release（清空旧资产后整批覆盖上传）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # 发行版标题（v0.6.2 起）：取 CHANGELOG 的「## vX.Y.Z（日期）— 描述」，去掉日期。
          # 此前标题就是 tag 本身，于是发行版列表里只见一个裸版本号 "v0.6.1"，
          # 看不出这版做了什么；Gitee/GitCode 侧同样问题（见 scripts/publish-mirror-releases.sh）。
          #
          # 用 python3 而不是 grep/sed：本机用 grep 匹配全角「（」时偶发
          # `grep: illegal byte sequence`（locale 相关），一旦命中就得到空标题——
          # 而「写空标题」是会真把发行版标题清掉的。python3 显式按 UTF-8 读，不受 locale 影响。
          # 只删日期那个括号：写成 （[^）]*） 会把「（补丁版）」「（确定性③）」一起吃掉。
          TITLE="$(python3 -c 'import re,sys
          t=open("CHANGELOG.md",encoding="utf8").read()
          m=re.search(r"^## v"+re.escape(sys.argv[1])+r"[^\n]*",t,re.M)
          line=re.sub(r"^## ","",m.group(0)) if m else ""
          line=re.sub(r"（\d{4}-\d{2}-\d{2}）","",line)
          print(re.sub(r"\s*—\s*"," ",line).strip())' "${TAG#v}")"
          [ -n "$TITLE" ] || TITLE="$TAG"
          echo "发行版标题：$TITLE"
          echo "gh 版本：$(gh --version | head -1)"
          gh auth status 2>&1 | sed 's/^/auth: /' | head -6
          # 只上传安装包 + 平台更新清单 + blockmap（差量更新用，见 build 步骤注释）。
          # 排除 builder-debug.yml（每平台 dist 都有一份，
          # 同批次重名会上传 422）与 latest-mac.yml（双架构合并版由官网发布流程在服务器生成）。
          # mac zip 文件名含空格，必须按行拆成数组再传参（不能直接 $FILES 分词）。
          mapfile -t FILE_ARR < <(find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest.yml' -o -name 'latest-linux.yml' \) | sort)
          echo "待上传："; printf '%s\n' "${FILE_ARR[@]}"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在：先清空旧资产"
            while IFS= read -r n; do
              echo "删除旧资产：$n"
              gh release delete-asset "$TAG" "$n" -R "$REPO" --yes > /tmp/del.out 2>&1 || echo "  （删除失败，忽略：$(tail -c 200 /tmp/del.out)）"
            done < <(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
            if gh release upload "$TAG" "${FILE_ARR[@]}" -R "$REPO" --clobber > /tmp/up.out 2>&1; then
              echo "上传成功"
            else
              echo "::error title=gh-release-upload::$(tail -c 1500 /tmp/up.out)"
              exit 1
            fi
          else
            echo "Release 不存在：创建并上传"
            if gh release create "$TAG" "${FILE_ARR[@]}" -R "$REPO" --generate-notes --title "$TITLE" > /tmp/cr.out 2>&1; then
              echo "创建成功"
            else
              echo "::error title=gh-release-create::$(tail -c 1500 /tmp/cr.out)"
              exit 1
            fi
          fi
          # 发行政策（2026-09-11 修订）：安装包**长期保留**在 Release 上，不再删除。
          # 此前（2026-08-28 政策）附件只作官网收割的构建转运、同步后由
          # scripts/github-release-cleanup.mjs 删除；该做法已废止——用户应能直接从任一平台下载。
          # 官网 https://harness.mingdao.ai/#downloads 与 gitee/gitcode 的 Release 同步提供同一批包。
          gh release edit "$TAG" -R "$REPO" --title "$TITLE" --notes '桌面版安装包（Windows / macOS / Linux）直接在本页下方附件下载；国内直连极速镜像与校验值见官网：https://harness.mingdao.ai/#downloads —— 本 Release 附件长期保留，不再清理。' >/dev/null 2>&1 || true

  # Release 正文规范化（2026-09-11 发行政策修订的配套）
  #
  # 背景：政策从「附件只作构建转运、同步后自动移除」改为「安装包长期保留」后，**历史 Release**
  # 的正文仍写着「官网同步后即由发布流程自动移除」——正文是用户下单前唯一会读的东西，
  # 政策变了而正文没变，等于在错误的承诺上继续引导用户。
  #
  # 为什么单独做成 workflow_dispatch 作业：改写已有 Release 需要 contents:write，而本地没有 PAT；
  # 复用工作流自带的 GITHUB_TOKEN，既不需要新密钥，改动也留在 CI 审计里可追溯。
  # 用法：Actions → Desktop → Run workflow → normalize_tag 填 v0.5.0（只改正文，不构建、不动附件）。
  normalize-release-notes:
    if: github.event_name == 'workflow_dispatch' && inputs.normalize_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 改写指定 tag 的 Release 正文与标题
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.normalize_tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # 确认 Release 存在，避免把拼错的 tag 静默当成成功
          gh release view "$TAG" -R "$REPO" >/dev/null
          # 顺手把标题也纠正成「vX.Y.Z 描述」（v0.4.5–v0.6.1 的历史发行版标题是裸版本号）。
          # 走这个通道回填的理由与正文规范化相同：复用工作流自带的 GITHUB_TOKEN，
          # 不需要本地 PAT，改动留在 CI 审计里可追溯。
          # 用 python3 而非 grep/sed：全角字符在 grep 下可能触发 illegal byte sequence，
          # 那会得到空标题并把发行版标题真清掉（本机回填时就踩过，见 CHANGELOG 说明）。
          TITLE="$(python3 -c 'import re,sys
          t=open("CHANGELOG.md",encoding="utf8").read()
          m=re.search(r"^## v"+re.escape(sys.argv[1])+r"[^\n]*",t,re.M)
          line=re.sub(r"^## ","",m.group(0)) if m else ""
          line=re.sub(r"（\d{4}-\d{2}-\d{2}）","",line)
          print(re.sub(r"\s*—\s*"," ",line).strip())' "${TAG#v}")"
          [ -n "$TITLE" ] || TITLE="$TAG"
          echo "标题将为：$TITLE"
          gh release edit "$TAG" -R "$REPO" --title "$TITLE" --notes '桌面版安装包（Windows / macOS / Linux）直接在本页下方附件下载；国内直连极速镜像与校验值见官网：https://harness.mingdao.ai/#downloads —— 本 Release 附件长期保留，不再清理。'
          echo "已改写 $TAG 的正文与标题："
          gh release view "$TAG" -R "$REPO" --json name,body -q '.name, .body'

