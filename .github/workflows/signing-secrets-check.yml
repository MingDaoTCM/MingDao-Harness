# 签名/公证 Secrets 自检（**只能手动触发**，不发版、不构建）。
#
# 为什么需要这个：GitHub Secrets 是**只写**的——配错（少一位、带上了换行、base64 被截断、
# App 专用密码敲错）平时看不出来，**只会在下一次发版时**才暴露，而那正是最不该出问题的时候。
# 这个 job 把"配没配好"变成 30 秒可查的一件事：只打印**长度与形状**（正则是否匹配），
# 从不打印值本身（GitHub 也会把 secret 值在日志里打码）。
#
# 用法：Actions → Signing secrets check → Run workflow（分支选 main）。
name: Signing secrets check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 5 个 Apple 签名/公证 Secrets 的形状
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          fail=0
          chk() {
            # $1 名称  $2 值  $3 最小长度  $4 形状正则
            local n="$1" v="$2" min="$3" re="$4"
            if [ -z "$v" ]; then echo "✗ $n 未配置"; fail=1; return; fi
            if [ "${#v}" -lt "$min" ]; then echo "✗ $n 长度 ${#v} < ${min}（可能被截断）"; fail=1; return; fi
            if ! printf '%s' "$v" | grep -Eq "$re"; then echo "✗ $n 形状不符（正则 ${re}）"; fail=1; return; fi
            echo "✓ $n 长度 ${#v} 形状匹配"
          }
          # CSC_LINK：p12 的 base64（DER 以 MII 开头；完整证书链 >3KB）
          chk CSC_LINK "$CSC_LINK" 3000 '^MII[A-Za-z0-9+/]+=*$'
          # CSC_KEY_PASSWORD：p12 导出密码（长度 ≥6，无控制字符）
          chk CSC_KEY_PASSWORD "$CSC_KEY_PASSWORD" 6 '^[^[:cntrl:]]+$'
          # APPLE_ID：邮箱形态
          chk APPLE_ID "$APPLE_ID" 5 '^[^@[:space:]]+@[^@[:space:]]+$'
          # APPLE_APP_SPECIFIC_PASSWORD：Apple 的 xxxx-xxxx-xxxx-xxxx 形态
          chk APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD" 19 '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$'
          # APPLE_TEAM_ID：10 位大写字母/数字
          chk APPLE_TEAM_ID "$APPLE_TEAM_ID" 10 '^[A-Z0-9]{10}$'
          echo
          if [ "$fail" = "0" ]; then echo "✓ 5 个 Secrets 形状全部通过（值本身不会被打印）"; else echo "✗ 有 Secrets 未通过检查——见上方逐条"; fi
          exit $fail
