name: MirrorSync
# 把指定 tag 的 Release 资产**从 GitHub 直接推到源站**（不占用本地上行）。
#
# 为什么要有它：本机（国内）到香港源站的上行实测只有 ~0.2MB/s（突发几秒后即被限速），
# 500MB 要 40–75 分钟；而 GitHub Actions 出网通常 10–100MB/s，同样一批文件 1–2 分钟。
# 这是"产物搬运"的**标准通道**：发版后（或补发时）手动触发一次即可。
#
# 用法：Actions → MirrorSync → Run workflow → tag 填 v0.6.39
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag（如 v0.6.39）'
        required: true
        type: string
      verify:
        description: '同步后逐文件 sha256 校验'
        required: false
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          mkdir -p dist
          gh release download "$TAG" -R "${{ github.repository }}" -D dist --clobber
          echo "资产数：$(ls dist | wc -l)"; du -sh dist

      - name: 上传到 OSS（香港）
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: |
          set -euo pipefail
          node scripts/oss-sync.mjs put dist downloads
          echo "== 回读校验 =="
          node scripts/oss-sync.mjs ls downloads | tail -5

      - name: 冒烟：匿名可下载
        run: |
          set -euo pipefail
          # 取一个 .dmg 做 1KB Range，确认 bucket 公共读与对象键都正确
          f=$(ls dist/*.dmg | head -1 | xargs basename)
          code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "https://${{ secrets.OSS_BUCKET }}.oss-cn-hongkong.aliyuncs.com/downloads/$f")
          echo "$f → HTTP $code"
          [ "$code" = "206" ] || { echo "::error title=oss-smoke::匿名下载失败（HTTP $code）"; exit 1; }
