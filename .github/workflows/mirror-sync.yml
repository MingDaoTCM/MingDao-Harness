name: MirrorSync
# 把指定 tag 的 Release 资产**从 GitHub 直接推到源站**（不占用本地上行）。
#
# 为什么要有它：本机（国内）到香港源站的上行实测只有 ~0.2MB/s（突发几秒后即被限速），
# 500MB 要 40–75 分钟；而 GitHub Actions 出网通常 10–100MB/s，同样一批文件 1–2 分钟。
# 这是"产物搬运"的**标准通道**：发版后（或补发时）手动触发一次即可。
#
# 用法：Actions → MirrorSync → Run workflow → tag 填 v0.6.39
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag（如 v0.6.39）'
        required: true
        type: string
      verify:
        description: '同步后逐文件 sha256 校验'
        required: false
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 下载 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          mkdir -p dist
          gh release download "$TAG" -R "${{ github.repository }}" -D dist --clobber
          echo "资产数：$(ls dist | wc -l)"
          du -sh dist

      - name: 推送到源站
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'echo connected; df -h / | tail -1'
          # 只同步安装包与 blockmap 到 downloads/；清单由服务器侧 feed 生成器重建，不从 CI 拷
          set +e
          scp -i ~/.ssh/deploy -o StrictHostKeyChecking=no -C \
            dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/downloads/" 2>/tmp/scp.err
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then echo "::warning title=scp::$(tail -c 800 /tmp/scp.err)"; fi

      - name: 逐文件校验（可选）
        if: ${{ inputs.verify }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=no"
          ( cd dist && sha256sum *.exe *.dmg *.zip *.AppImage *.deb *.blockmap 2>/dev/null | sort -k2 ) > /tmp/local.sha
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_DIR/downloads && sha256sum *.exe *.dmg *.zip *.AppImage *.deb *.blockmap 2>/dev/null | sort -k2" > /tmp/remote.sha
          # 远端目录里还留着历史版本，只比对本次上传的文件名
          cut -d' ' -f2- /tmp/local.sha | while read -r f; do
            grep -F "  $f" /tmp/remote.sha || { echo "::error title=verify::远端缺少 $f"; exit 1; }
          done
          echo "✓ 校验通过（$(wc -l < /tmp/local.sha | tr -d ' ') 个文件）"
